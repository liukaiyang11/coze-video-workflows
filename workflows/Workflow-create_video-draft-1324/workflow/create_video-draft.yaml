    - id: "1372140"
      type: llm
      title: 文案创建
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-LLM-v2.jpg
      description: "调用大语言模型,使用变量和提示词生成回复"
      version: "3"
      position:
        x: -1154.1734617531042
        y: -149.29071446300273
      parameters:
        fcParamVar:
            knowledgeFCParam: {}
        llmParam:
            - name: temperature
              input:
                type: float
                value: "0.8"
            - name: topP
              input:
                type: float
                value: "0.7"
            - name: frequencyPenalty
              input:
                type: float
                value: "0"
            - name: maxTokens
              input:
                type: integer
                value: "4096"
            - name: responseFormat
              input:
                type: integer
                value: "2"
            - name: modelName
              input:
                type: string
                value: 豆包·1.5·Pro·深度思考·128K
            - name: modelType
              input:
                type: integer
                value: "1744866658"
            - name: generationDiversity
              input:
                type: string
                value: balance
            - name: parameters
              input:
                type: object
                value: null
            - name: prompt
              input:
                type: string
                value: |
                    场景输入：{{changjing}}
                    风格输入：{{fengge}}
                    萌版：{{mengban}}
            - name: enableChatHistory
              input:
                type: boolean
                value: false
            - name: chatHistoryRound
              input:
                type: integer
                value: "3"
            - name: systemPrompt
              input:
                type: string
                value: |
                    你是一名专业的视觉叙事设计师，擅长根据极少量关键词创建具有逻辑性、氛围明确的“故事蓝图（Story Blueprint）”。

                    用户会提供三个信息：风格、场景、萌版类型。

                    你需要根据这三个输入，自动生成一个简洁清晰的故事蓝图。故事蓝图用于指导后续的视频脚本生成，因此必须包含：

                    1. role：主角是谁？他的外观风格（与萌版一致）、基本身份、情绪状态。
                    2. environment：场景如何呈现？背景空间、光线、氛围。
                    3. core_action：主角在这段10秒视频中的唯一核心动作（必须单一，不能多动作）。
                    4. mood：整体情绪调性（应与风格一致）。
                    5. story_flow：10秒内动作的逻辑进程（起 → 承 → 转 → 收，仅描述结构，不写细节）。
                    6. constraints：必须保持的限制（如：风格必须全程统一、不跳风格、不切镜头）。

                    要求：
                    - 输出的内容必须清楚、逻辑简单、易于用于后续生成连续镜头。
                    - 所有内容必须能自然转化为一个10秒不间断的镜头。
                    - 不要生成视频脚本，仅生成故事蓝图。

                    最终以如下 JSON 格式输出：

                    {
                      "role": "...",
                      "environment": "...",
                      "core_action": "...",
                      "mood": "...",
                      "story_flow": "...",
                      "constraints": "..."
                    }
            - name: stableSystemPrompt
              input:
                type: string
                value: ""
            - name: canContinue
              input:
                type: boolean
                value: false
            - name: loopPromptVersion
              input:
                type: string
                value: ""
            - name: loopPromptName
              input:
                type: string
                value: ""
            - name: loopPromptId
              input:
                type: string
                value: ""
        node_inputs:
            - name: changjing
              input:
                value:
                    path: changjing
                    ref_node: "100001"
            - name: fengge
              input:
                value:
                    path: fengge
                    ref_node: "100001"
            - name: mengban
              input:
                value:
                    path: mengban
                    ref_node: "100001"
        node_outputs:
            output:
                type: list
                items:
                    type: object
                    properties:
                        constraints:
                            type: string
                            value: null
                        core_action:
                            type: string
                            value: null
                        environment:
                            type: string
                            value: null
                        mood:
                            type: string
                            value: null
                        role:
                            type: string
                            value: null
                        story_flow:
                            type: string
                            value: null
                    value: null
                value: null
            reasoning_content:
                type: string
                value: null
        settingOnError:
            processType: 1
            retryTimes: 0
            timeoutMs: 180000
