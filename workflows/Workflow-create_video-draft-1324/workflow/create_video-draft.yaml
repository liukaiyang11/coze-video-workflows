        duration: 12
        dynamicParameters: []
        firstFrame:
            assistType: 2
            type: string
            value:
                content:
                    blockID: "100001"
                    name: img
                    source: block-output
                rawMeta:
                    type: 7
                type: ref
        generateMode: image2Video
        model: doubao-seedance-pro
        node_inputs:
