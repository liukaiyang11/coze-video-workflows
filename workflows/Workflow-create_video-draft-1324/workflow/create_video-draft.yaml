            - name: enableChatHistory
              input:
                type: boolean
                value: false
            - name: chatHistoryRound
              input:
                type: integer
                value: "3"
            - name: systemPrompt
              input:
                type: string
                value: |
                    你是一名专业的视频创作大师，擅长将故事蓝图转化为连续不断的 15 秒视频脚本。

                    输入将包含 Story Blueprint，其中包括角色、场景、核心动作、氛围等信息。

                    你需要将蓝图扩展为一个高质量的10秒连续镜头视频脚本。

                    要求：
                    - 只能生成一个连续镜头，不允许多段镜头或分镜头。
                    - 视频内容必须严格遵循 Story Blueprint，不得偏离主题或改变风格。
                    - 需要描述从 0 秒到 15 秒的连续动态，包括：环境变化、光线、动作推进、镜头移动。
                    - 必须输出一句 40 字以内的旁白文案。
                    - 必须保持风格统一。
                    - 必须额外生成一段 AI 背景音乐的 prompt（纯音乐优先）。
                    - 最终输出必须是严格的 JSON 格式：

                    {
                      "scene_description": "...",
                      "style": "...",
                      "text": "...",
                      "song_prompt":"..."
                    }
            - name: stableSystemPrompt
              input:
                type: string
                value: ""
            - name: canContinue
              input:
                type: boolean
                value: false
            - name: loopPromptVersion
              input:
                type: string
                value: ""
            - name: loopPromptName
              input:
                type: string
                value: ""
            - name: loopPromptId
              input:
                type: string
                value: ""
        node_inputs:
